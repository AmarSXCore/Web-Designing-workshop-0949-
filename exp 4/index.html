<!DOCTYPE html>
<html>
<head>
    
    <title>Document</title>
</head>
<body>
    <form action="#" align="center">
        <h1>Hotel Booking Form</h1> 
        <br><br>
           <label for="full name">Full Name:</label>
           <input type="text" name ="full name" id="full name">
           <br><br>

           <label for="Phone number">Phone Number:</label>
           <input type="text" name ="Phone number" id="Phone number">
           <br><br>

           <label for="Check In">Check In:</label>
           <input type="date" name ="Check In" id="Check In">
           <br><br>

           <label for="Check Out">Check Out:</label>
           <input type="date" name ="Check Out" id="Check Out">
           <br><br>

           <label for="Room Type">Room Type:</label>
           <select name="Room Type" id="Room Type">
               <option value="Single">Single</option>
               <option value="Double">Double</option>
               <option value="triple">triple</option>
               <option value="suite">suite</option>
               <option value="luxury">luxury</option>
           </select>
           <br><br>
           <label for="Number of Guests">Number of Guests:</label>
           <input type="number" name ="Number of Guests" id="Number of Guests"> 
          
           <br><br>
           <textarea name="message" id="Special Requests" placeholder="Any special requests or notes..."></textarea>
           <br><br>

           <button type="submit">Submit</button>
           <button type="reset">Reset</button>
        </form>
        
</body>
</html>
